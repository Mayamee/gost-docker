name: tests

on:
  push:
    branches: [main]

jobs:
  proxy-tests:
    name: Proxy smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests
        env:
          # Внешний upstream для smoke: у Actions нет внутреннего echo-роута
          TEST_URL: https://github.com
        run: ./tests.sh
